<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hadron Collider">
  <title>Hadron Collider</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1626" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>
    <radialGradient id="ip" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#9fe1ff" />
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cc8ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#5cc8ff" />
    </linearGradient>
    <linearGradient id="beam2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6bd6" stop-opacity="0" />
      <stop offset="100%" stop-color="#ff6bd6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Beam pipe: outer and inner wall of the ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#5cc8ff" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#5cc8ff" stroke-opacity="0.18" stroke-width="1" />

  <!-- Beam 1 (clockwise) and Beam 2 (counter-clockwise) converging at the bottom IP -->
  <path d="M 12.9 22 A 19.5 19.5 0 0 0 32 51.5" fill="none" stroke="url(#beam1)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 51.1 22 A 19.5 19.5 0 0 1 32 51.5" fill="none" stroke="url(#beam2)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Interaction point -->
  <circle cx="32" cy="51.5" r="7" fill="url(#ip)" />
  <circle cx="32" cy="51.5" r="2" fill="#ffffff" />
</svg>